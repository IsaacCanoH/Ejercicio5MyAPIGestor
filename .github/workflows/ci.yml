name: CI API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Pruebas con PostgreSQL y Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/dbgestor_ci
      DB_USERNAME: gestor_ci
      DB_PASSWORD: clave_ci_temporal
      MONITORING_USERNAME: monitor_ci
      MONITORING_PASSWORD: monitoreo_ci_temporal

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: dbgestor_ci
          POSTGRES_USER: gestor_ci
          POSTGRES_PASSWORD: clave_ci_temporal
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gestor_ci -d dbgestor_ci"
          --health-start-period=30s
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Inicializar estructura de PostgreSQL
        run: |
          docker exec -i \
            --env PGPASSWORD="$DB_PASSWORD" \
            "${{ job.services.db.id }}" \
            psql \
            --host=127.0.0.1 \
            --username="$DB_USERNAME" \
            --dbname=dbgestor_ci \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            < src/test/resources/schema-ci.sql

      - name: Compilar y ejecutar pruebas
        run: bash ./mvnw -B -ntp clean verify

      - name: Guardar reportes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-api
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

      - name: Construir imagen Docker
        run: docker build --tag gestor-api:ci .
