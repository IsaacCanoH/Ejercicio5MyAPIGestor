spring.application.name=Ejercicio5MyAPIGestor
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/dbgestor}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.security.user.name=${MONITORING_USERNAME}
spring.security.user.password=${MONITORING_PASSWORD}